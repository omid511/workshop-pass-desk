name: Bug report
description: Report a reproducible problem in the plugin or Playground demo.
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Give the smallest set of steps, WordPress version, and WooCommerce version needed to reproduce it.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: PHP, WordPress, WooCommerce, browser, and commit
    validations:
      required: true
