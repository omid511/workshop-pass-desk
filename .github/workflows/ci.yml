name: CI

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: workshop-pass-desk-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3']
    steps:
      - uses: actions/checkout@v6
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
      - name: Lint PHP
        run: |
          set -eu
          find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Contract tests
        run: php tests/test_contract.php
      - name: Behavioral tests
        run: php tests/test_behavioral.php
      - name: Package plugin
        run: |
          set -eu
          rm -rf dist
          mkdir -p dist/workshop-pass-desk
          cp workshop-pass-desk.php uninstall.php README.md readme.txt LICENSE dist/workshop-pass-desk/
          cp -R includes assets languages dist/workshop-pass-desk/
          (cd dist && zip -qr workshop-pass-desk.zip workshop-pass-desk)
      - name: Upload Playground-ready artifact
        uses: actions/upload-artifact@v4
        with:
          name: workshop-pass-desk-php-${{ matrix.php }}
          path: dist/workshop-pass-desk.zip
          if-no-files-found: error
      - name: WordPress smoke path
        run: echo 'Full WordPress/WooCommerce integration smoke path is documented in README.md; use a disposable Playground or test site with the uploaded ZIP.'
