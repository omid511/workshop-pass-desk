name: Release plugin artifact

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: workshop-pass-desk-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  package:
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - name: Verify and package plugin
        run: |
          set -eu
          find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php tests/test_contract.php
          php tests/test_behavioral.php
          rm -rf dist
          mkdir -p dist/workshop-pass-desk
          cp workshop-pass-desk.php uninstall.php README.md readme.txt LICENSE dist/workshop-pass-desk/
          cp -R includes assets languages dist/workshop-pass-desk/
          (cd dist && zip -qr workshop-pass-desk.zip workshop-pass-desk)
      - name: Generate SHA-256 checksum
        run: (cd dist && sha256sum workshop-pass-desk.zip > workshop-pass-desk.zip.sha256)
      - name: Attach plugin ZIP to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/workshop-pass-desk.zip dist/workshop-pass-desk.zip.sha256 --repo "$GITHUB_REPOSITORY" --clobber
