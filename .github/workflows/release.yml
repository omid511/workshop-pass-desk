name: Release plugin artifact

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - name: Verify and package plugin
        run: |
          set -eu
          find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php tests/test_contract.php
          rm -rf dist
          mkdir -p dist/workshop-pass-desk
          cp workshop-pass-desk.php README.md LICENSE dist/workshop-pass-desk/
          cp -R includes assets dist/workshop-pass-desk/
          (cd dist && zip -qr workshop-pass-desk.zip workshop-pass-desk)
      - name: Attach plugin ZIP to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/workshop-pass-desk.zip --repo "$GITHUB_REPOSITORY" --clobber
